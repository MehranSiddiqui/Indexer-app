packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/client': set this to true or false
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  prisma: true
  unrs-resolver: true
overrides:
  body-parser: 2.4.0
  "brace-expansion@>=5.0.0": 5.0.11
  deepmerge-ts: 8.0.0
  fast-uri: 3.1.6
  follow-redirects: 1.16.1
  mysql2: 3.22.0
  postcss: 8.5.18
  proxy-addr: 2.0.8
  source-map-js: 1.2.2
  tinypool: 2.1.2
  vite: 7.3.7
